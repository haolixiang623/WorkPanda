name: 仓库基础门禁

on:
  pull_request:
  push:
    branches:
      - main
      - 'workbuddy/**'

permissions:
  contents: read

jobs:
  governance:
    name: 文档与敏感信息基础检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 检查必需规范文件
        shell: bash
        run: |
          set -euo pipefail
          test -s AGENTS.md
          test -s design/DESIGN.md
          test -s docs/DEVELOPMENT-OPERATING-MECHANISM.md
          test -s .github/pull_request_template.md
          test -s .github/ISSUE_TEMPLATE/feature.yml
          test -s .github/ISSUE_TEMPLATE/bug.yml

      - name: 检查 Markdown 空白和链接引用
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '[[:blank:]]+$' -- '*.md' '*.yml'; then
            echo '发现行尾空白，请修复后再提交。' >&2
            exit 1
          fi
          for path in AGENTS.md design/DESIGN.md docs/DEVELOPMENT-OPERATING-MECHANISM.md; do
            test -s "$path"
          done

      - name: 基础敏感信息扫描
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})' -- ':!*.lock'; then
            echo '疑似凭据或私钥进入仓库，请移除并通过授权的密钥渠道处理。' >&2
            exit 1
          fi

  python:
    name: Python 检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      # 注意：不要在 job 级 if 里使用 hashFiles()，它只在步骤级可用，
      # job 级求值会让整个工作流启动即失败（startup_failure，无任何 job 产生）。
      - name: 检查项目元数据
        shell: bash
        run: test -s pyproject.toml
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装项目和开发依赖
        run: |
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
      - name: Ruff 检查
        run: ruff check .
      - name: 运行测试
        run: pytest
      # 识别评测是发布门禁的一部分：跑全部已发布流程的意图样例，输出混淆矩阵、
      # 误路由率与漏路由率。误路由必须为 0；漏路由超上限、样例条数不足、评测
      # 超时或崩溃都判失败——"没有结论"不许当通过。
      - name: 识别评测门禁
        run: python scripts/evaluate_intents.py

  # 浏览器用例单独一个 job：它们的依赖（Playwright + chromium）不该装进每个
  # Python job，但**也不能因此消失**。`WORKPANDA_REQUIRE_BROWSER=1` 让"缺浏览器"
  # 在这里是失败而不是跳过——跳过当通过是这类门禁最典型的失效方式（job 配错了
  # 也只是绿）。靶子用仓库自带的 mock-site，本机进程内起两个端口，不访问外网。
  browser:
    name: 浏览器执行器检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装项目、浏览器组件与开发依赖
        run: |
          python -m pip install -e ".[browser]"
          python -m pip install -r requirements-dev.txt
      - name: 安装 chromium
        run: python -m playwright install --with-deps chromium
      - name: 运行浏览器用例
        env:
          WORKPANDA_REQUIRE_BROWSER: '1'
        run: pytest tests/test_browser_harness.py -q
