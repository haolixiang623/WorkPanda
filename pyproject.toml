[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "workpanda"
version = "0.1.0"
description = "WorkPanda controlled workflow runtime host"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=42,<52",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sse-starlette>=2.1,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.7,<1.0",
]
# 浏览器执行器（P2）。**必须钉死版本**：Playwright 每次大版本都会改定位与等待
# 语义，浮动版本会让"同一份代码在 CI 与本机行为不同"，而这类差异恰好表现为
# "元素找不到"——最容易被当成页面改版放过去的一种失败。
# 浏览器二进制不进仓库，装完再跑 `playwright install chromium`。
browser = [
  "playwright==1.64.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/workpanda"]

[tool.pytest.ini_options]
# `mock-site` 也在这里：模拟站是独立应用（不进 `src/`），但它的接口级回归要和全量
# 测试一起跑，否则「靶子自己坏了」不会在 CI 里红。它只提供 `mock_site` 一个包名，
# 与产品包不重叠。
pythonpath = ["src", "mock-site"]
asyncio_mode = "auto"
# `browser` 标记的用例需要真实 chromium。CI 里另有一个 job 装浏览器并设
# `WORKPANDA_REQUIRE_BROWSER=1`：那个 job 里缺浏览器是**失败**，不是跳过。
markers = [
  "browser: 需要真实浏览器（chromium）的用例，CI 单独 job 运行",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
