[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "workpanda"
version = "0.1.0"
description = "WorkPanda controlled workflow runtime host"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sse-starlette>=2.1,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.7,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/workpanda"]

[tool.pytest.ini_options]
# `mock-site` 也在这里：模拟站是独立应用（不进 `src/`），但它的接口级回归要和全量
# 测试一起跑，否则「靶子自己坏了」不会在 CI 里红。它只提供 `mock_site` 一个包名，
# 与产品包不重叠。
pythonpath = ["src", "mock-site"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
